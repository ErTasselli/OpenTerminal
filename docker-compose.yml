services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    # Bound to localhost by default: only this machine can reach the API.
    # To expose it on your network/internet, bind wider here AND set API_KEY
    # below explicitly (otherwise a fresh key is generated per container).
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Local Ollama (optional). Defaults to the Docker host, so an Ollama
      # running on this machine is reachable from inside the container.
      # Point it somewhere else by setting OLLAMA_BASE_URL in a .env file
      # next to this compose file (docker compose reads it automatically),
      # e.g. OLLAMA_BASE_URL=http://192.168.1.50:11434
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - API_KEY=${API_KEY:-}
      - API_HOST=0.0.0.0 # safe: still only published to 127.0.0.1 above
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:3000}
      - DATA_DIR=/app/data
      # Leave unset unless you put your own trusted reverse proxy in front of
      # the web service (see README > Security defaults) — otherwise a caller
      # could forge X-Forwarded-For to dodge the /api/ai rate limit.
      - TRUST_PROXY=${TRUST_PROXY:-}
    extra_hosts:
      # Makes "host.docker.internal" resolve on Linux too (Docker Desktop
      # resolves it natively).
      - "host.docker.internal:host-gateway"
    volumes:
      - terminal-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - API_URL=http://api:4000
      - API_KEY=${API_KEY:-}
      - API_KEY_FILE=/app/data/.api-key
    volumes:
      - terminal-data:/app/data:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  terminal-data:
